name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # armv7 is not built because ort-sys (fastembed's ONNX Runtime backend)
      # ships no prebuilt binaries for armv7-linux-androideabi.
      - name: Build Android Debug APK (aarch64)
        shell: bash
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: >-
          pnpm android:build --debug --verbose --apk --split-per-abi
          --target aarch64

      - name: Collect Android Debug APK and checksums
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          apk_root="src-tauri/crates/tauritavern/gen/android/app/build/outputs/apk"
          mkdir -p dist
          mapfile -t apks < <(find "${apk_root}" -type f -name '*debug*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one aarch64 debug APK, found ${#apks[@]} under ${apk_root}" >&2
            exit 1
          fi
          apk="${apks[0]}"
          if [[ "$(basename "${apk}")" != "app-arm64-debug.apk" ]]; then
            echo "Expected app-arm64-debug.apk, found ${apk}" >&2
            exit 1
          fi
          echo "APK: ${apk}"
          cp "${apk}" dist/
          (cd dist && sha256sum -- ./*.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauritavern-android-debug-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish aarch64 Debug APK GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-debug-aarch64-${GITHUB_SHA:0:7}"
          title="TauriTavern Android Debug APK (aarch64) ${GITHUB_SHA:0:7}"
          notes=$(cat <<EOF
          Automated aarch64 Debug APK build.

          - Commit: \`${GITHUB_SHA}\`
          - Package: \`com.tauritavern.client.debug\`
          - ABI: \`arm64-v8a\`
          - Signing: standard Android Debug key
          EOF
          )
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refreshing aarch64 assets"
            gh release upload "${tag}" dist/app-arm64-debug.apk dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" dist/app-arm64-debug.apk dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
          fi
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' > release-assets.txt
          grep -qx 'app-arm64-debug.apk' release-assets.txt
          grep -qx 'SHA256SUMS' release-assets.txt
          echo "GitHub Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
